<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf6e6"/>
      <stop offset="1" stop-color="#f5e8cf"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" />
      <feOffset dy="10" />
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- subtle dot pattern -->
  <g fill="#3d2f23" opacity="0.04">
    <circle cx="100" cy="80" r="3"/>
    <circle cx="180" cy="140" r="2"/>
    <circle cx="60" cy="220" r="2.5"/>
    <circle cx="1100" cy="500" r="3"/>
    <circle cx="1050" cy="560" r="2"/>
    <circle cx="1140" cy="430" r="2.5"/>
  </g>

  <!-- pill icon -->
  <g transform="translate(200 315) rotate(-25)" filter="url(#shadow)">
    <rect x="-150" y="-65" width="300" height="130" rx="65" fill="url(#mint)"/>
    <rect x="-150" y="-65" width="150" height="130" rx="65" fill="url(#coral)"/>
    <rect x="-3" y="-65" width="6" height="130" fill="#3d2f23" opacity="0.6"/>
    <ellipse cx="-90" cy="-22" rx="14" ry="9" fill="#fff" opacity="0.55"/>
    <circle cx="-58" cy="2" r="6" fill="#fff" opacity="0.4"/>
  </g>

  <!-- text -->
  <g transform="translate(440 220)">
    <text font-size="92" font-weight="700" fill="#2a221b" letter-spacing="-2">おくすリマインダー</text>
    <text y="100" font-size="40" font-weight="500" fill="#5a4838">のんだ？にワンタップで答えるだけ。</text>
    <text y="180" font-size="28" font-weight="400" fill="#877360">飲み忘れと「飲んだっけ？」を防ぐ</text>

    <!-- pill: のんだ -->
    <g transform="translate(0 230)">
      <rect width="160" height="56" rx="28" fill="#34d399"/>
      <text x="80" y="38" font-size="26" font-weight="600" fill="#2a221b" text-anchor="middle">のんだ</text>
    </g>
    <!-- pill: あとで -->
    <g transform="translate(180 230)">
      <rect width="160" height="56" rx="28" fill="#fff" stroke="#dccdb0" stroke-width="2"/>
      <text x="80" y="38" font-size="26" font-weight="600" fill="#5a4838" text-anchor="middle">あとで</text>
    </g>
  </g>

  <!-- footer URL -->
  <text x="1140" y="600" font-size="22" fill="#877360" text-anchor="end">okusu-reminder.vercel.app</text>
</svg>
