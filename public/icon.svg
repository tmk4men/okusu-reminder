<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf6e6"/>
      <stop offset="1" stop-color="#f5deb8"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bubbleShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Pill (centered, slightly rotated) -->
  <g transform="translate(245 295) rotate(-32)" filter="url(#pillShadow)">
    <rect x="-150" y="-65" width="300" height="130" rx="65" fill="url(#mint)"/>
    <rect x="-150" y="-65" width="150" height="130" rx="65" fill="url(#coral)"/>
    <rect x="-3" y="-65" width="6" height="130" fill="#3d2f23" opacity="0.6"/>
    <ellipse cx="-90" cy="-22" rx="14" ry="9" fill="#fff" opacity="0.5"/>
    <circle cx="-58" cy="2" r="6" fill="#fff" opacity="0.35"/>
  </g>

  <!-- "?" speech bubble (upper-right) -->
  <g transform="translate(385 145)" filter="url(#bubbleShadow)">
    <path d="
      M -68 0
      a 68 68 0 1 1 136 0
      a 68 68 0 1 1 -136 0
      M -32 56
      l -8 30
      l 32 -22
      Z" fill="#ffffff" stroke="#3d2f23" stroke-width="6" stroke-linejoin="round"/>
    <text x="0" y="6" font-family="system-ui,-apple-system,'Hiragino Sans',sans-serif" font-size="92" font-weight="900" fill="#3d2f23" text-anchor="middle" dominant-baseline="central">?</text>
  </g>
</svg>
